{# A cell that is text until it is clicked.

   `editable` draws the text and keeps the box that will replace it in an inert
   `<template>`: `static/app.js` swaps the two when the cell is clicked or
   tabbed to, and the box is a real input with its own `hx-patch`, saving when
   it is left. `change` is the browser's own "committed" — it fires on blur and
   on Enter, not on a keystroke — so there is nothing to press.

   The id on the box is what keeps the focus: the day is redrawn after a save,
   and HTMX puts the cursor back in the element with the same id. #}
{% macro editable(text, placeholder="") -%}
<span class="cell-text" tabindex="0" title="click to edit"><span class="cell-value"
  data-placeholder="{{ placeholder }}">{{ text }}</span><template>{{ caller() }}</template></span>
{%- endmacro %}

{% macro cell(entry, target, field, value, size, label, placeholder="") -%}
{% call editable(value, placeholder) -%}
<input type="text" class="cell" id="entry-{{ entry.id }}-{{ field }}" name="{{ field }}"
       value="{{ value }}" size="{{ size }}" aria-label="{{ label }}"
       placeholder="{{ placeholder }}" hx-patch="/entries/{{ entry.id }}"
       hx-trigger="change" hx-target="{{ target }}" hx-swap="outerHTML">
{%- endcall %}
{%- endmacro %}

{% macro note(entry, target) -%}
{% call editable(entry.notes or "", "notes") -%}
<textarea class="cell" id="entry-{{ entry.id }}-notes" name="notes" rows="1" cols="14"
          aria-label="notes" placeholder="notes" hx-patch="/entries/{{ entry.id }}"
          hx-trigger="change" hx-target="{{ target }}"
          hx-swap="outerHTML">{{ entry.notes or "" }}</textarea>
{%- endcall %}
{%- endmacro %}
