sections:

  # a section uses exactly one kind of pattern:
  #
  # sequence: one character per repetition of the whole snippet
  # bars:     one character per bar
  # beats:    one character per beat, spaces optional, group them per bar
  # markers:  spans in any order, repeats allowed
  #
  # a span is [where it starts] or [start-end], and the end is exclusive:
  #
  #   [4] 4th bar   [D51] bar labelled D51   [1.4] 4th beat of bar 1
  #   [b2] beat labelled b2                  [JOHN] text block JOHN
  #   [1-3] bars 1 and 2   [1.4-3] from bar 1 beat 4 up to bar 3
  #   [JOHN-3.2] from JOHN up to bar 3 beat 2   [1.1-JOHN] the top, up to JOHN
  #   a trailing x silences the span: [4x], [1-3x]
  #
  # a short first bar is taken for a pickup and numbered 0, so [1] is
  # still the first full bar and [0-1] is the pickup on its own. The
  # markers have to cover that upbeat: audio before the first marker
  # cannot be reached, and shifts everything else if it is included
  #
  # END is reserved and always means the end of the snippet, so [4-END]
  # is the 4th bar in full wherever it appears. A trailing bar marker
  # with no beats under it names the same point and is never played, so
  # with bars 92 and 93, [92-93] and [92-END] are the same span
  #
  # with no end, a span runs to where the next one starts, or to the end
  # of the snippet, so a pattern can chop a snippet into pieces:
  #
  # - name: the whole snippet, cut at two cues
  #   repeat: 2
  #   markers: "[1.1][UP1][UP2]"
  #
  # to repeat or reorder, give each span its own end:
  #
  # - name: drill bar 1, then run into bar 3
  #   repeat: 3
  #   markers: "[1-2][1-2][1-2] [JOHN-3]"
  #
  # drill:    one pattern standing for a run of sections that silence its
  #           regions in turn. Taking [A][B][C][D] with keep 1:
  #
  #   each   one at a time: Bx, Cx, Dx
  #   head   a growing head: Bx, BxCx, BxCxDx
  #   tail   a growing tail: Dx, CxDx, BxCxDx
  #   build  a shrinking tail, so the phrase grows back a region at a time
  #   widen  a window that slides, widens by one, and slides again
  #   solo   each region in turn as the only one still sounding
  #
  # steps run in the order given and never repeat a silencing already
  # reached. keep holds the leading regions while a window moves through
  # the rest; solo ignores it
  #
  # - name: heaven
  #   drill: "[START][M1.1][M2.1][M3.1-END]"
  #   steps: [widen, solo]   # the default
  #   reference: 1   # repeats of the plain pattern, before each step
  #   repeat: 3      # repeats of each silenced pattern
  #   keep: 1        # leading regions the window leaves alone
  #
  # run with --expand to print what a drill stands for and stop, then
  # paste that back in its place to hand-edit from there

   - name: whole thing
     repeat: 2
     bars: "1111"

   - name: lose the end of A4
     repeat: 1
     beats: "1111 1111 1111 11xx"

   - name: lose A4
     repeat: 1
     bars: "111x"

   - repeat: 1
     beats: "1111 1111 11xx 1xxx"
  
   - repeat: 1
     beats: "1111 11xx 1xxx 1xxx"
  
   - repeat: 1
