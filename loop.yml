snippet: I Want You Back - Jackson 5 - loop 1.wav
output: I Want You Back - Jackson 5 - practice 1.wav

marker_file: I Want You Back - Jackson 5 - loop 1.txt

sections:

  # a section uses exactly one kind of pattern:
  #
  # sequence: one character per repetition of the whole snippet
  # bars:     one character per bar
  # beats:    one character per beat, spaces optional, group them per bar
  # markers:  spans in any order, repeats allowed
  #
  # a span is [where it starts] or [start-end], and the end is exclusive:
  #
  #   [4] 4th bar   [D51] bar labelled D51   [1.4] 4th beat of bar 1
  #   [b2] beat labelled b2                  [JOHN] text block JOHN
  #   [1-3] bars 1 and 2   [1.4-3] from bar 1 beat 4 up to bar 3
  #   [JOHN-3.2] from JOHN up to bar 3 beat 2   [1.1-JOHN] the top, up to JOHN
  #   a trailing x silences the span: [4x], [1-3x]
  #
  # with no end, a span runs to the next address of its own kind, so
  # [1] is [1-2] and [1.1] is [1.1-1.2]
  #
  # - name: drill bar 1, then run into bar 3
  #   repeat: 3
  #   markers: "[1][1][1] [JOHN-3]"

   - name: whole thing
     repeat: 2
     bars: "1111"

   - name: lose the end of A4
     repeat: 1
     beats: "1111 1111 1111 11xx"

   - name: lose A4
     repeat: 1
     bars: "111x"

   - repeat: 1
     beats: "1111 1111 11xx 1xxx"
  
   - repeat: 1
     beats: "1111 11xx 1xxx 1xxx"
  
   - repeat: 1
     beats: "1111 1xxx 1xxx 1xxx"
  
   - repeat: 1
     beats: "11xx 1xxx 1xxx 1xxx"
  
   - repeat: 1
     beats: "1xxx 1xxx 1xxx 1xxx"
  
   - repeat: 1
     beats: "1xxx xxxx 1xxx xxxx"
  
   - repeat: 1
     beats: "1xxx 1xxx 1xxx 1xxx"

   - repeat: 1
     beats: "1xxx xxxx 1xxx xxxx"
  
